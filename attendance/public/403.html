<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Office network only · Teqnowebs Attendance</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: linear-gradient(160deg, #eef2f7, #fff);
        color: #1e293b;
        padding: 1.5rem;
      }
      main {
        max-width: 28rem;
        background: #fff;
        border: 1px solid #1e293b1f;
        border-radius: 1rem;
        padding: 2rem;
      }
      h1 {
        margin: 0;
        font-size: 1.35rem;
      }
      p {
        margin: 0.75rem 0 0;
        color: #64748b;
        line-height: 1.5;
        font-size: 0.95rem;
      }
      a {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Office network only</h1>
      <p>
        Staff attendance works on the <strong>office Wi‑Fi / LAN</strong> only.
        Connect to the office network and open the attendance address again.
      </p>
      <p>
        Admins can still open
        <a href="/admin/">/admin/</a>
        from anywhere after signing in at
        <a href="/login/">/login/</a>.
      </p>
      <p>
        Public site:
        <a href="https://teqnowebs.com/">teqnowebs.com</a>
      </p>
    </main>
  </body>
</html>
